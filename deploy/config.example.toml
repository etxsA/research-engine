# Settings of the research API on a shared server, for deploy/research-api.sh. Copy this file to
# config.toml inside the data folder (default: ~/research-api, or the folder named by
# RESEARCH_API_HOME), make it private and edit the lines marked CHANGE:
#
#   mkdir -m 700 -p ~/research-api
#   cp deploy/config.example.toml ~/research-api/config.toml
#   chmod 600 ~/research-api/config.toml
#
# The start script refuses to run when this file can be read by other accounts. It holds no
# secret, but whoever can edit it can move public_origin, and with it the Origin check. Every key
# is described in packages/research-api/README.md. Placeholders only: nothing here names a real
# machine, user or network.

# CHANGE: the server's own Tailscale address (`tailscale ip -4` on the server). The service
# answers on this address and on loopback, and refuses 0.0.0.0, a LAN address and a host name.
bind_host = "100.64.0.10"
port = 8090

# CHANGE: the one address everyone types in the browser, written exactly as they type it. The
# page and the sign-in work only under this origin, so give the team one URL: the Tailscale
# address above, or the server's MagicDNS name. HTTP is fine inside a tailnet (WireGuard
# encrypts it); use https:// only when something in front of the service really terminates TLS.
public_origin = "http://100.64.0.10:8090"

# CHANGE: absolute paths inside the data folder. The script keeps its own files (run, backups,
# web) in the same folder. Database and data stay in separate folders so each can be backed up
# alone. All three folders are made private (mode 0700).
db_path = "/path/to/research-api/db/research-api.sqlite3"
data_dir = "/path/to/research-api/data"
log_dir = "/path/to/research-api/logs"

# CHANGE: the docingest settings file the operator uses (it names the papers, the index and the
# model servers), as an absolute path to a file that exists, for example a stage2-current.toml
# in the operator's own config folder. Without this line the service starts, but every question
# gets a 503 and no paper can be read. A change needs a restart.
docingest_config = "/path/to/docingest/config/stage2-current.toml"

# The built web app is found through the `web/current` link in the data folder, which
# `deploy/research-api.sh install-web` maintains; no setting is needed. (web_dir exists only to
# serve a folder from somewhere else.)

# Sessions end after this many hours without a request, or this many days after sign-in.
session_idle_hours = 12
session_max_days = 7

# Failed sign-ins allowed per username in the window; one address gets four times as many.
login_max_failures = 5
login_window_minutes = 15

# CHANGE: the models a benchmark run may ask. `name` is what the model server serves the model as
# (vLLM's served name), `endpoint` is the address up to /v1 (no key, query or fragment), `label` is
# shown in the web app, and `revision` is the commit of the served weights; it is written in the
# run header. The harness and oracle arms answer with docingest's own model, so they run only on
# the entry whose `name` is the last `/` part of docingest's model (`qwen-local` for
# `llm = "openai/qwen-local"`). Without an entry no run can be requested.
# [[models]]
# name = "qwen-local"
# endpoint = "http://127.0.0.1:8001/v1"
# label = "Qwen (local)"
# revision = "fill in the weights revision"

# OPTIONAL: speech to text for the question box (the person speaks, the text lands in the box to
# edit and is never sent by itself; nothing is stored). Without this table speech is unavailable:
# the Speak button is off, a request gets a 503, and /status says so. Setup, the secure-page rule
# for the microphone and troubleshooting: docs/run-guide.md, section "Ask by voice". Restart the
# service after you change this table.
#   stt_endpoint     the speech server's address up to /v1 (serving/serve.sh stt start listens on
#                    127.0.0.1:8004). Plain http only for a loopback or Tailscale address, else https.
#   stt_model        the name the speech server answers to (default local-stt).
#   stt_api_key_file path of a file that holds only the key, mode 0600, outside the
#                    repository. It is the same file the speech server reads (by default
#                    $SERVING_STATE_DIR/stt.key, which is ~/.local/state/research-engine/stt.key; a
#                    leading ~ is expanded). The key is never written here.
#   max_audio_bytes  largest clip, in bytes (default 2 MiB).
#   max_audio_s      longest clip, in seconds (default 60).
#   timeout_s        wait in line plus work for one clip, in seconds (default 30).
#   per_member_open  open transcriptions allowed per member (default 2).
#
# The microphone opens only on https, http://localhost or http://127.0.0.1. To use voice from a
# laptop through an SSH tunnel (ssh -N -L 8090:<tailscale-address>:8090 <user>@<server>), set
# public_origin = "http://localhost:8090" above and restart: writes (sign-in, ask, speech) are
# accepted only when the browser's Origin equals public_origin, and every write on the Tailscale
# URL is then refused with a 403 (sign-in, ask, speech, edit), also for people already signed in.
# Put the old value back to give the team its URL again.
# [speech]
# stt_endpoint = "http://127.0.0.1:8004/v1"
# stt_model = "local-stt"
# stt_api_key_file = "/path/to/stt.key"
# max_audio_bytes = 2097152
# max_audio_s = 60
# timeout_s = 30
# per_member_open = 2
