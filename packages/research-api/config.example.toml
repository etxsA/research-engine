# Settings of the research API. Copy it outside the repository and edit it; start the service
# with `research-api serve --config <file>` or set RESEARCH_API_CONFIG. Every key is optional.
# A mistyped key is an error. No secret belongs here. Keep the file mode 0600 (chmod 600): the
# service refuses to start from a file that other accounts can read or change.

# The address to listen on: a loopback address, or the host's Tailscale address. Anything else
# (0.0.0.0, a LAN address, a host name) is refused.
bind_host = "127.0.0.1"
port = 8090

# The origin people type in the browser, used later to check where a write request came from.
# Written the way a browser sends it: lowercase, and no port when it is the default one (80 for
# http, 443 for https). Defaults to http://<bind_host>:<port>.
public_origin = "http://127.0.0.1:8090"

# Where the service keeps its files. Absolute paths; all three folders are made private (mode
# 0700) if missing, and the service refuses to start when one of them, or the database file,
# is readable by group or others. Needed to run for real; `--fake` ignores them.
data_dir = "/path/to/research-api/data"
db_path = "/path/to/research-api/db/research-api.sqlite3"
# The docingest settings file that names the papers, the index and the model servers (see
# docs/run-guide.md of the repository). Without it everything works except asking questions and
# reading papers. An absolute path to a file that exists; a change needs a restart.
docingest_config = "/path/to/docingest.toml"
# Optional. Without it the log lines go to standard error. With it: <log_dir>/api.log, mode
# 0600, rotated at 10 MiB, five kept.
# log_dir = "/path/to/research-api/logs"

# Optional. The built web app (apps/web/dist, or a link to it). With it the service serves the
# page from its own origin, so the browser needs no second address and the API needs no CORS.
# web_dir = "/path/to/research-api/web/current"

# Sessions end after this many hours without a request, or this many days after sign-in.
session_idle_hours = 12
session_max_days = 7

# Failed sign-ins allowed per username in the window; one address gets four times as many.
# Past that the answer is 429 with Retry-After.
login_max_failures = 5
login_window_minutes = 15

# What the circuit check accepts. The check runs inside the API process, so these keep one
# request small. A bigger circuit is a 422 that points to the `quantum-sim` command.
[circuit_caps]
max_body_bytes = 1048576   # request body, in bytes (answer 413 above it)
max_ops = 2000             # operations in the circuits of one request (answer 422 above it)
timeout_s = 30             # seconds to wait for one request (answer 422 after it)

# The models a benchmark run may ask (the closed-book arm calls them directly). `name` is what
# the server serves the model as (vLLM's served name), `endpoint` is the address up to /v1: no
# key, no query, no fragment, a key never goes in this file. Plain http is for a loopback or
# Tailscale address only; any other host needs https. `label` and `revision` are shown
# and written in the run header. A request names one of these models. The harness and oracle
# arms answer with docingest's own model, so they run only on the entry whose `name` is the last
# `/` part of docingest's model (`qwen-local` when `[qa] llm` is "openai/qwen-local"); any other
# model is a 422 for those arms. Without any entry no run can be requested.
# [[models]]
# name = "qwen-local"
# endpoint = "http://127.0.0.1:8001/v1"
# label = "Qwen (local)"
# revision = "fill in the weights revision"

# Optional. Speech to text for the question box: the person speaks, the text lands in the box for
# them to edit. Without this table speech is unavailable (a 503, and /status says so). Nothing is
# stored: no audio and no text, in the database, in a file or in the log. The speech server speaks
# the OpenAI audio API (POST <stt_endpoint>/audio/transcriptions) and is reached over plain http
# only on a loopback or Tailscale address; any other host needs https. The key is not written
# here: put it alone in a file readable by this account only (chmod 600) and name the file.
# [speech]
# stt_endpoint = "http://127.0.0.1:8004/v1"   # the address up to /v1
# stt_model = "local-stt"                     # the name the server serves it as
# stt_api_key_file = "/path/to/research-api/secrets/stt.key"
# max_audio_bytes = 2097152                   # 2 MiB per clip (answer 413 above it)
# max_audio_s = 60                            # seconds per clip (answer 422 above it)
# timeout_s = 30                              # seconds to wait for one clip (answer 503 after it)
# per_member_open = 2                         # open transcriptions and readings per member (answer 429 above it)
# Reading answers aloud (text to speech), with its own server, key and limits. Without tts_endpoint
# it is unavailable (a 503, /status says so, and the web app uses the browser's voice). The
# server speaks the OpenAI audio API (POST <tts_endpoint>/audio/speech). Neither the text nor the
# audio is stored or logged. Each pair (stt_endpoint and stt_api_key_file, tts_endpoint and
# tts_api_key_file) goes together; the two halves are independent.
# tts_endpoint = "http://127.0.0.1:8005/v1"   # the address up to /v1
# tts_model = "local-tts"                     # the name the server serves it as
# tts_api_key_file = "/path/to/research-api/secrets/tts.key"
# tts_voice_es = "default"                    # the voice for Spanish text
# tts_voice_en = "default"                    # the voice for English text
# max_tts_chars = 400                         # characters per request after cleanup, 1 to 2000 (answer 422 above it)
# tts_timeout_s = 30                          # seconds to wait for one sentence (answer 503 after it)
